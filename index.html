<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1017">
  <title>导航</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon-192.png">
<style>
/* Critical first-paint styles (full styles load via Vite) */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: dark; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background: #0d1017;
  color: #eef1f7;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
#app { position: relative; min-height: 100vh; }
a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
  <script>
    // 首帧就垫上上次的背景：配置要经网关往返 1~2.5s 才回来，不然这段时间页面是纯深色，
    // 每次打开都像"背景黑一下才出来"。这里读 App.vue 写入的 nav_bg_cache（几十字节）。
    // 用注入 <style> 而不是直接改 body.style：解析到这一行时 document.body 可能还没就绪，
    // 而 <style> 只依赖已经解析完的 head，并且它排在关键 CSS 之后，能稳压初始的深色底。
    (function () {
      try {
        var c = JSON.parse(localStorage.getItem('nav_bg_cache') || 'null')
        if (!c) return
        var css = c.wp ? 'url("' + c.wp + '") center / cover no-repeat fixed' : (c.bg || '')
        if (!css) return
        var st = document.createElement('style')
        st.id = '__bg_pre'
        st.textContent = 'html, body { background: ' + css + '; }'
        document.head.appendChild(st)
      } catch (e) {}
    })()
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
