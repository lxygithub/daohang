name = "daohang"
compatibility_date = "2025-01-01"
# ── 2026-09-17：由 Pages 项目改为 Worker（静态资源 + Functions 编译产物）──
# 动机：Cloudflare Pages Functions 的子请求不满足网关 WAF 的
# `cf.worker.upstream_zone eq "ieop.top"` 条件（被 403 拦），改成 Worker 后
# 与 forgotIt 同属 ieop.top Zone，规则原样放行，无需改 WAF/Access。
# 入口由 `wrangler pages functions build functions --outdir=functions-worker` 生成，
# 官方命令：把 Pages Functions 目录编译成单个 Worker（产物自带 env.ASSETS 回退）。
main = "functions-worker/index.js"

# 域名绑定：用 zone route 而不是 custom_domain。
# 两个主机名上已有 Pages 时代留下的 A 记录（已代理），custom_domain 会要求
# 先删掉这些「外部管理的 DNS 记录」（错误码 100117）并自建 CNAME；
# zone route 直接复用现有解析，不需要任何 DNS 改动。
# 2026-09-17：ieoc.top 已从域名中移除（该 Zone 未被网关 WAF 的
# cf.worker.upstream_zone 条件放行，接入网关必然 403），只保留 ieop.top。
routes = [
  { pattern = "daohang.ieop.top/*", zone_name = "ieop.top" },
]

[assets]
directory = "dist"
binding = "ASSETS"
# 站点是 SPA：/login、/xyz 等都返回 index.html（Pages 原有行为）
not_found_handling = "single-page-application"
# 只让 API 走 Worker（必须写在 [assets] 内，放顶层会被忽略）。
# 不能写 true：那样连静态资源也要先经过 Worker，而开了 Smart Placement 后 Worker
# 会被放到靠近数据源（家用机）的位置，静态资源就跟着绕远——官方文档明确警告过。
# 前端只有 /api/* 需要 Worker，其余交给边缘的静态资源层，SPA 回退由上面那行负责。
run_worker_first = ["/api/*"]

# ── 环境变量管理规则（Worker 形态）────────────────────────────
#   * 明文变量 → 只能在本文件 [vars] 里维护，随部署生效；
#   * 机密 → `wrangler secret put <NAME>`，或 Dashboard → Worker → Settings →
#     Variables and Secrets；机密与 Pages 项目**不共享**，迁移时需重设。
# 判断标准：泄露即出事的（API key、token）→ 机密；其余 → [vars]。

# Smart Placement：数据源在家用机（经 Cloudflare Tunnel），让 Worker 尽量靠近数据源
# 执行，减少「边缘 → 隧道 → 家机」往返对延迟的影响（单程约 2.5s 的那段）。
[placement]
mode = "smart"

[vars]
# 管理员账号（逗号分隔可多个）。这些邮箱登录后显示「用户管理」入口，可重置/禁用/删除任意用户。
ADMIN_EMAILS = "594328762@qq.com"

# 找回密码邮件（Brevo：免费 300 封/天，无需验证域名，邮件可能进垃圾箱属正常）。
# 发件人须先在 brevo.com → Senders 验证（当前为 mewlxyy666@gmail.com；如换请改下行）；
# BREVO_API_KEY 在 Dashboard 以加密机密配置，不进本文件。
RESET_MAIL_FROM = "daohang <mewlxyy666@gmail.com>"
# 兼容备用：旧 Resend 通道仍保留——仅当未配置 BREVO_API_KEY 而配置了 RESEND_API_KEY（机密）时启用。

# 自建图床（CloudFlare-ImgBed，已启用）：编辑弹窗上传的图标自动转存图床换外链，
# 不再 base64 内联。鉴权 Bearer IMG_UPLOAD_TOKEN 走仪表板加密机密。
IMG_UPLOAD_API = "https://img-bed.ieoc.top/upload"

# IMG_UPLOAD_FIELD = "file"   ← cfbed 默认字段名即 file，无需配置
# IMG_UPLOAD_TOKEN = "..."   ← 鉴权 token 走仪表板加密机密，勿写进本文件
# IMG_UPLOAD_QUERY = "token=..."  ← 若图床用查询串鉴权，同样建议放机密

# 管理密码：明文不放这里（会随 Git 进仓库）。
# → 在 Dashboard 添加加密机密 ADMIN_PASSWORD（建议设个新强密码）；
#   或改用其 sha256 十六进制值放 [vars]（可公开的弱等价形式，仍建议优先用机密）：
# ADMIN_PASSWORD_SHA256 = "<sha256 hex>"
# 未配置两者时服务端回退内置默认（与历史仓库一致），首次部署后请尽快改成机密。

# SQL Gateway（内网数据库统一查询入口）。地址与 target 名均非机密，放 [vars]；
# 调用一律经 functions/lib/gateway.js，不要散落裸 fetch。用法见 DEPLOY.md「SQL Gateway 接入」。
# daohang.ieop.top 与网关同属 ieop.top Zone，WAF 表达式原样放行，无需改；
# 服务器侧 targets 允许未完成之前，探针 /api/gateway/ping 返回 502 属预期，不影响其它功能。
SQL_GATEWAY_URL = "https://db-gateway.ieop.top/v1/query"
# 2026-09-17：本项目的表已独立到 daohang 库（原先寄生在 forgotit 库的 daohang schema），
# 用独立 target 与独立 ro/rw 账号，库级隔离、可单独备份/下线。
SQL_GATEWAY_TARGET = "daohang-postgres"

# 2026-09-17：D1 库已随 Pages 项目一并删除，绑定必须移除——否则 `wrangler deploy`
# 会报 `code 10181: D1 binding 'DB' references database ... which was not found`。
# 数据早已迁到内网 PostgreSQL（daohang 库，28,717 行），D1 无残留用途；
# migrations/ 与 scripts/d1-*.mjs 仅作历史参考。
